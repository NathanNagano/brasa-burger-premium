name: Publicar produto aprovado

run-name: Publicar ${{ inputs.product_id || 'produto' }}

on:
  workflow_dispatch:
    inputs:
      product_id:
        description: ID imutável do produto
        required: true
        type: string
      product_json:
        description: Dados normalizados do produto
        required: true
        type: string
      staging_path:
        description: Caminho da foto original no repositório privado de staging
        required: true
        type: string
      staging_sha:
        description: SHA da foto original no staging
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: product-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código atual
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Baixar foto original privada
        env:
          STAGING_REPOSITORY: ${{ secrets.PRODUCT_STAGING_REPOSITORY }}
          STAGING_TOKEN: ${{ secrets.PRODUCT_STAGING_TOKEN }}
          STAGING_PATH: ${{ inputs.staging_path }}
        run: |
          test -n "$STAGING_REPOSITORY"
          test -n "$STAGING_TOKEN"
          mkdir -p .product-staging
          curl --fail-with-body --location \
            --header "Accept: application/vnd.github.raw+json" \
            --header "Authorization: Bearer $STAGING_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${STAGING_REPOSITORY}/contents/${STAGING_PATH}?ref=main" \
            --output .product-staging/original

      - name: Instalar conversor de imagem
        run: npm install --prefix automation/github-publisher --omit=dev --no-package-lock

      - name: Converter foto para WebP
        env:
          SOURCE_IMAGE_PATH: .product-staging/original
          TARGET_WEBP_PATH: .product-staging/product.webp
        run: node automation/github-publisher/convert-product-image.mjs

      - name: Validar e preparar produto
        env:
          PRODUCT_JSON: ${{ inputs.product_json }}
          IMAGE_PATH: .product-staging/product.webp
        run: node scripts/publish-product.mjs

      - name: Instalar dependências do site
        run: npm ci

      - name: Testar catálogo e build
        run: |
          npm run test
          npm run build

      - id: commit
        name: Versionar produto publicado
        env:
          PRODUCT_ID: ${{ inputs.product_id }}
        run: |
          if git diff --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "brasa-product-bot"
          git config user.email "brasa-product-bot@users.noreply.github.com"
          git add public/assets/products src/data/automated-products.json
          git commit -m "chore(products): publish ${PRODUCT_ID}"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Remover original do staging privado
        if: success()
        continue-on-error: true
        env:
          STAGING_REPOSITORY: ${{ secrets.PRODUCT_STAGING_REPOSITORY }}
          STAGING_TOKEN: ${{ secrets.PRODUCT_STAGING_TOKEN }}
          STAGING_PATH: ${{ inputs.staging_path }}
          STAGING_SHA: ${{ inputs.staging_sha }}
          PRODUCT_ID: ${{ inputs.product_id }}
        run: |
          node -e 'process.stdout.write(JSON.stringify({message: `chore(staging): remove ${process.env.PRODUCT_ID}`, sha: process.env.STAGING_SHA, branch: "main"}))' > cleanup.json
          curl --fail-with-body --location --request DELETE \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $STAGING_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data @cleanup.json \
            "https://api.github.com/repos/${STAGING_REPOSITORY}/contents/${STAGING_PATH}"

      - name: Atualizar aprovação na planilha
        if: always()
        env:
          SHEETS_CALLBACK_URL: ${{ secrets.PRODUCT_SHEETS_CALLBACK_URL }}
          SHEETS_CALLBACK_SECRET: ${{ secrets.PRODUCT_SHEETS_CALLBACK_SECRET }}
          PRODUCT_ID: ${{ inputs.product_id }}
          WORKFLOW_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          if [ -z "$SHEETS_CALLBACK_URL" ] || [ -z "$SHEETS_CALLBACK_SECRET" ]; then
            echo "Callback da planilha não configurado; status ficará em PUBLICANDO."
            exit 0
          fi
          node -e 'process.stdout.write(JSON.stringify({secret: process.env.SHEETS_CALLBACK_SECRET, productId: process.env.PRODUCT_ID, status: process.env.WORKFLOW_STATUS, commitSha: process.env.COMMIT_SHA || ""}))' > callback.json
          curl --fail-with-body --location --retry 2 --retry-delay 2 \
            --header "Content-Type: application/json" \
            --data @callback.json \
            "$SHEETS_CALLBACK_URL"
